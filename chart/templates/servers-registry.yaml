apiVersion: apps/v1
kind: Deployment
metadata: {{ $fullname := printf "%s-%s" .Release.Name .Chart.Name | trunc 63 | trimSuffix "-" }}
  name: {{ $fullname }}-servers-registry
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
spec:
  selector:
    matchLabels:
      app: {{ $fullname }}-servers-registry
  replicas: {{ default 1 .Values.servers_registry.replicaCount | int }}
  template:
    metadata:
      labels:
        app: {{ $fullname }}-servers-registry
    spec:
      containers:
      - name: {{ .Release.Name }}-servers-registry
        image: "{{ .Values.servers_registry.image.repository }}:{{ .Values.servers_registry.image.tag }}"
        imagePullPolicy: {{ .Values.servers_registry.image.pullPolicy | toString }}
        env:
        - name: PORT
          value: "{{ .Values.servers_registry.service.internalPort | int }}"
{{- if .Values.servers_registry.redis.addresses }}
        - name: REDIS_ADDRESSES
          value: "{{ join "," .Values.servers_registry.redis.addresses }}"
        - name: REDIS_MASTER_NAME
          value: "{{ .Values.servers_registry.redis.masterName }}"
        - name: REDIS_USERNAME
          value: "{{ .Values.servers_registry.redis.username }}"
        - name: REDIS_PASSWORD
          value: "{{ .Values.servers_registry.redis.password }}"
        - name: REDIS_DB
          value: "{{ .Values.servers_registry.redis.database | int }}"
{{- else }}
        - name: REDIS_URL
          value: redis://{{ .Release.Name }}-redis-headless:6379/0
{{- end }}
        - name: NATS_URL
          value: nats://{{ .Release.Name }}-nats:4222
        - name: WORLD_DB_CONNECTION
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-databases-config
              key: WORLD_DB_CONNECTION
        - name: AREA_TRIGGER_CATALOG_VERSION
          value: "{{ .Values.servers_registry.portalCatalog.version }}"
        - name: AREA_TRIGGER_CATALOG_IMPORT_ENABLED
          value: "{{ .Values.servers_registry.portalCatalog.importEnabled }}"
        - name: LAYER_MAPS
          value: "{{ join "," .Values.servers_registry.layering.maps }}"
        ports:
        - containerPort: {{ .Values.servers_registry.service.internalPort | int  }}
        # livenessProbe:
        #   httpGet:
        #     path: /healthcheck
        #     port: {{ .Values.servers_registry.service.internalPort | int }}
        # readinessProbe:
        #   httpGet:
        #     path: /healthcheck
        #     port: {{ .Values.servers_registry.service.internalPort | int }}
        securityContext:
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
          # runAsNonRoot: true
          allowPrivilegeEscalation: false
        resources:
{{ toYaml .Values.resources | indent 10 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-servers-registry
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
spec:
  type: {{ .Values.servers_registry.service.type }}
  ports:
  - port: {{ .Values.servers_registry.service.externalPort | int  }}
    targetPort: {{ .Values.servers_registry.service.internalPort | int  }}
    protocol: TCP
  selector:
    app: {{ $fullname }}-servers-registry
