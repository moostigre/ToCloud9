---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: testrealm-shared-services, namespace: tc9-ptr}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [ptr-databases-config]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [ptr-tocloud9-charserver, ptr-tocloud9-chatserver, ptr-tocloud9-guidserver, ptr-tocloud9-guildserver, ptr-tocloud9-groupserver, ptr-tocloud9-mailserver, ptr-tocloud9-auctionhouse, ptr-tocloud9-matchmakingserver]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: testrealm-operator, namespace: tc9-ptr}
subjects: [{kind: ServiceAccount, name: testrealm-operator, namespace: tc9-testrealm-system}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: testrealm-shared-services}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: testrealm-operator, namespace: tc9-testrealm-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: testrealm-operator}}
  template:
    metadata: {labels: {app: testrealm-operator}}
    spec:
      serviceAccountName: testrealm-operator
      automountServiceAccountToken: true
      containers:
        - name: operator
          image: REPLACE_WITH_OPERATOR_IMAGE_DIGEST
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: PUBLIC_ADDRESS, value: "logon.expanded.space"}
            - {name: TC9_GATEWAY_IMAGE, value: "tc9/gateway:layering-c42a0cd"}
            - name: OPERATOR_HMAC_SECRET
              valueFrom: {secretKeyRef: {name: testrealm-secrets, key: operator-secret}}
            - name: TC9_DB_USER
              valueFrom: {secretKeyRef: {name: testrealm-secrets, key: database-user}}
            - name: TC9_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: testrealm-secrets, key: database-password}}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 2}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata: {name: testrealm-operator, namespace: tc9-testrealm-system}
spec:
  selector: {app: testrealm-operator}
  ports: [{name: http, port: 80, targetPort: http}]
