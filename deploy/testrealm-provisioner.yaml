---
apiVersion: v1
kind: Secret
metadata:
  name: testrealm-secrets
  namespace: tc9-testrealm-system
type: Opaque
stringData:
  activity-hmac-secret: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  operator-secret: REPLACE_ONLY_WHEN_OPERATOR_IS_ENABLED
  catalogue-hmac-secret: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  database-user: REPLACE_WITH_DATABASE_USER
  database-password: REPLACE_WITH_DATABASE_PASSWORD
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: testrealm-images
  namespace: tc9-testrealm-system
data:
  images.json: '{}'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: testrealm-state
  namespace: tc9-testrealm-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testrealm-provisioner
  namespace: tc9-testrealm-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: testrealm-provisioner}
  template:
    metadata:
      labels: {app: testrealm-provisioner}
    spec:
      serviceAccountName: testrealm-provisioner
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: REPLACE_WITH_PROVISIONER_IMAGE_DIGEST
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: MAX_RUNNING_REALMS, value: "5"}
            - {name: MAX_CONCURRENT_BUILDS, value: "25"}
            - {name: BUILD_GITHUB_OWNER, value: moostigre}
            - {name: BUILD_GITHUB_REPO, value: ToCloud9}
            - {name: BUILD_GITHUB_WORKFLOW, value: build-ac-pr-testrealm.yml}
            - {name: BUILD_GITHUB_REF, value: master}
            - {name: IDLE_AFTER, value: 30m}
            - {name: PURGE_AFTER, value: 48h}
            - {name: IMAGE_CATALOG_FILE, value: /data/catalog/images.json}
            - {name: ALLOWED_IMAGE_PREFIX, value: ghcr.io/moostigre/tc9-ac-pr}
            - {name: ALLOWED_IMPORTER_PREFIX, value: ghcr.io/moostigre/tc9-ac-pr-dbimport}
            - {name: REALM_OPERATOR_URL, value: http://testrealm-operator.tc9-testrealm-system.svc.cluster.local}
            - {name: STATE_FILE, value: /data/testrealm/state.json}
            - {name: TMPDIR, value: /data/tmp}
            - name: ACTIVITY_HMAC_SECRET
              valueFrom: {secretKeyRef: {name: testrealm-secrets, key: activity-hmac-secret}}
            - name: REALM_OPERATOR_SECRET
              valueFrom: {secretKeyRef: {name: testrealm-secrets, key: operator-secret}}
            - name: CATALOGUE_HMAC_SECRET
              valueFrom: {secretKeyRef: {name: testrealm-secrets, key: catalogue-hmac-secret}}
            - name: GITHUB_TOKEN
              valueFrom: {secretKeyRef: {name: testrealm-secrets, key: github-token}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe: {httpGet: {path: /api/status, port: http}, initialDelaySeconds: 2}
          livenessProbe: {httpGet: {path: /api/status, port: http}, initialDelaySeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          workingDir: /data
          volumeMounts:
            - {name: state, mountPath: /data}
            - {name: images, mountPath: /data/config, readOnly: true}
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: testrealm-state}
        - name: images
          configMap: {name: testrealm-images}
---
apiVersion: v1
kind: Service
metadata:
  name: testrealm-provisioner
  namespace: tc9-testrealm-system
spec:
  selector: {app: testrealm-provisioner}
  ports:
    - {name: http, port: 80, targetPort: http}
