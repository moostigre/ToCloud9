apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
kubeReserved:
  cpu: "1"
  memory: 2Gi
systemReserved:
  cpu: "1"
  memory: 2Gi
enforceNodeAllocatable:
  - pods
evictionHard:
  memory.available: 1Gi
  nodefs.available: 5%
  imagefs.available: 5%
evictionMinimumReclaim:
  memory.available: 512Mi
  nodefs.available: 10%
  imagefs.available: 10%
