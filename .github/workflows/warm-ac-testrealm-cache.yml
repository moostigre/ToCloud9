name: Warm trusted AzerothCore test-realm cache

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [master]
    paths:
      - game-server/azerothcore/Dockerfile
      - game-server/azerothcore/patches/**
      - game-server/libsidecar-cpp/**
      - api/proto/**
      - .github/workflows/warm-ac-testrealm-cache.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: ac-testrealm-trusted-cache
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve trusted AzerothCore baseline
        id: baseline
        run: |
          sha="$(git ls-remote https://github.com/azerothcore/azerothcore-wotlk.git refs/heads/master | cut -f1)"
          test "${#sha}" = 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Compile trusted baseline and publish reusable cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: game-server/azerothcore/Dockerfile
          target: gameserver
          platforms: linux/amd64
          push: false
          build-args: |
            AC_REF=${{ steps.baseline.outputs.sha }}
            AC_BUILD_TYPE=Release
          cache-from: type=gha,scope=ac-testrealm-trusted
          cache-to: type=gha,scope=ac-testrealm-trusted,mode=max,ignore-error=true
