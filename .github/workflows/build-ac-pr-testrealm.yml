name: Build AzerothCore PR test realm
run-name: "Build ${{ inputs.source_repository || github.event.client_payload.source_repository || 'azerothcore/azerothcore-wotlk' }} PR #${{ inputs.pr_number || github.event.client_payload.pr_number }}"

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Allowlisted AzerothCore source repository
        required: true
        default: azerothcore/azerothcore-wotlk
        type: choice
        options:
          - azerothcore/azerothcore-wotlk
          - moostigre/azerothcore-wotlk
      pr_number:
        description: Open AzerothCore PR number
        required: true
        type: number
      modules:
        description: Comma-separated trusted AzerothCore module names
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [build-ac-testrealm]

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: ac-testrealm-${{ inputs.source_repository || github.event.client_payload.source_repository || 'azerothcore/azerothcore-wotlk' }}-${{ inputs.pr_number || github.event.client_payload.pr_number }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve eligible PR
        id: pr
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository || github.event.client_payload.source_repository || 'azerothcore/azerothcore-wotlk' }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.client_payload.pr_number }}
          MODULES: ${{ inputs.modules || github.event.client_payload.modules }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$SOURCE_REPOSITORY" in
            azerothcore/azerothcore-wotlk|moostigre/azerothcore-wotlk) ;;
            *) echo "Source repository is not allowlisted" >&2; exit 1 ;;
          esac
          case "$PR_NUMBER" in (*[!0-9]*|'') exit 1;; esac
          response="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$SOURCE_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r .state <<<"$response")" = open
          test "$(jq -r .draft <<<"$response")" = false
          sha="$(jq -r .head.sha <<<"$response")"
          test "${#sha}" = 40
          test "$(git ls-remote "https://github.com/$SOURCE_REPOSITORY.git" "refs/pull/$PR_NUMBER/head" | cut -f1)" = "$sha"
          echo "repository=$SOURCE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "tag_source=${SOURCE_REPOSITORY//\//-}" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          module_refs=()
          module_names=()
          if [ -n "$MODULES" ]; then
            IFS=',' read -ra requested <<< "$MODULES"
            (( ${#requested[@]} <= 5 ))
            declare -A seen=()
            for module in "${requested[@]}"; do
              [[ "$module" =~ ^[a-z0-9][a-z0-9-]{1,62}$ ]]
              [ -z "${seen[$module]:-}" ]
              seen[$module]=1
              metadata="$(gh api "repos/azerothcore/$module")"
              [ "$(jq -r .owner.login <<<"$metadata")" = azerothcore ]
              jq -e '.topics | index("azerothcore-module") != null' <<<"$metadata" >/dev/null
              branch="$(jq -r .default_branch <<<"$metadata")"
              module_sha="$(gh api "repos/azerothcore/$module/commits/$branch" --jq .sha)"
              [[ "$module_sha" =~ ^[a-f0-9]{40}$ ]]
              module_refs+=("$module@$module_sha")
              module_names+=("$module")
            done
          fi
          refs="$(IFS=,; echo "${module_refs[*]}")"
          modules_json="$(printf '%s\n' "${module_names[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "module_refs=$refs" >> "$GITHUB_OUTPUT"
          echo "modules_json=$modules_json" >> "$GITHUB_OUTPUT"

      - name: Verify signed progress reporting
        env:
          CALLBACK_URL: ${{ secrets.TESTREALM_CATALOG_URL }}
          CALLBACK_SECRET: ${{ secrets.TESTREALM_CATALOG_SECRET }}
          SOURCE_REPOSITORY: ${{ steps.pr.outputs.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          [ "$CALLBACK_URL" = "https://test.expanded.space" ]
          [ -n "$CALLBACK_SECRET" ]
          body="$(jq -nc --argjson run_id "$GITHUB_RUN_ID" --arg repository "$SOURCE_REPOSITORY" --argjson pr "$PR_NUMBER" \
            '{run_id:$run_id,source_repository:$repository,pr_number:$pr,progress_percent:3,detail:"Build runner connected; preparing AzerothCore compilation"}')"
          timestamp="$(date +%s)"
          signature="$(printf '%s.%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" -hex | awk '{print $2}')"
          curl --fail --silent --show-error --max-time 10 -X POST "$CALLBACK_URL/internal/build-progress" \
            -H 'Content-Type: application/json' -H "X-TC9-Timestamp: $timestamp" \
            -H "X-TC9-Signature: $signature" --data-binary "$body"

      - uses: docker/setup-buildx-action@v3
      # Exposes the short-lived GitHub Actions cache credentials to direct
      # buildx invocations. Pinned because this step handles runtime tokens.
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish runtime
        id: runtime
        env:
          CALLBACK_URL: ${{ secrets.TESTREALM_CATALOG_URL }}
          CALLBACK_SECRET: ${{ secrets.TESTREALM_CATALOG_SECRET }}
          SOURCE_REPOSITORY: ${{ steps.pr.outputs.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          AC_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -o pipefail
          last_percent=-1
          docker buildx build . \
            --file game-server/azerothcore/Dockerfile \
            --target gameserver \
            --platform linux/amd64 \
            --push \
            --build-arg "AC_REPOSITORY=https://github.com/${SOURCE_REPOSITORY}.git" \
            --build-arg "AC_REF=$AC_SHA" \
            --build-arg AC_BUILD_TYPE=Release \
            --build-arg 'AC_MODULES=${{ steps.pr.outputs.module_refs }}' \
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER}/tc9-ac-pr:${{ steps.pr.outputs.tag_source }}-pr-${PR_NUMBER}-${AC_SHA}" \
            --cache-from type=gha,scope=ac-testrealm-trusted \
            --metadata-file runtime-metadata.json \
            --progress plain 2>&1 | while IFS= read -r line; do
              printf '%s\n' "$line"
              if [[ "$line" =~ \[[[:space:]]*([0-9]{1,3})%\] ]]; then
                percent="${BASH_REMATCH[1]}"
                if (( percent != last_percent && percent >= 0 && percent <= 100 )); then
                  last_percent="$percent"
                  if [ -n "$CALLBACK_URL" ] && [ -n "$CALLBACK_SECRET" ]; then
                    body="$(jq -nc --argjson run_id "$GITHUB_RUN_ID" --arg repository "$SOURCE_REPOSITORY" --argjson pr "$PR_NUMBER" \
                      --argjson progress "$percent" --arg detail "Compiling AzerothCore — ${percent}%" \
                      '{run_id:$run_id,source_repository:$repository,pr_number:$pr,progress_percent:$progress,detail:$detail}')"
                    timestamp="$(date +%s)"
                    signature="$(printf '%s.%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" -hex | awk '{print $2}')"
                    curl --fail --silent --show-error --max-time 10 -X POST "$CALLBACK_URL/internal/build-progress" \
                      -H 'Content-Type: application/json' -H "X-TC9-Timestamp: $timestamp" \
                      -H "X-TC9-Signature: $signature" --data-binary "$body" || true
                  fi
                fi
              fi
            done
          digest="$(jq -er '."containerimage.digest"' runtime-metadata.json)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build and publish database importer
        id: importer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: game-server/azerothcore/Dockerfile
          target: db-import
          platforms: linux/amd64
          push: true
          build-args: |
            AC_REPOSITORY=https://github.com/${{ steps.pr.outputs.repository }}.git
            AC_REF=${{ steps.pr.outputs.sha }}
            AC_BUILD_TYPE=Release
            AC_MODULES=${{ steps.pr.outputs.module_refs }}
          tags: ghcr.io/${{ github.repository_owner }}/tc9-ac-pr-dbimport:${{ steps.pr.outputs.tag_source }}-pr-${{ steps.pr.outputs.number }}-${{ steps.pr.outputs.sha }}
          cache-from: type=gha,scope=ac-testrealm-trusted

      - name: Publish signed catalogue entry
        env:
          URL: ${{ secrets.TESTREALM_CATALOG_URL }}
          SECRET: ${{ secrets.TESTREALM_CATALOG_SECRET }}
          SOURCE_REPOSITORY: ${{ steps.pr.outputs.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          IMPORTER_DIGEST: ${{ steps.importer.outputs.digest }}
          MODULES_JSON: ${{ steps.pr.outputs.modules_json }}
          BUILD_PROFILE: fixtures-v2
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "Catalogue callback is not configured; skipping."
            exit 0
          fi
          body="$(jq -nc --arg repository "$SOURCE_REPOSITORY" --argjson pr "$PR_NUMBER" --arg sha "$SHA" \
            --arg image "ghcr.io/${GITHUB_REPOSITORY_OWNER}/tc9-ac-pr@${RUNTIME_DIGEST}" \
            --arg importer "ghcr.io/${GITHUB_REPOSITORY_OWNER}/tc9-ac-pr-dbimport@${IMPORTER_DIGEST}" \
            --argjson modules "$MODULES_JSON" \
            --arg build_profile "$BUILD_PROFILE" \
            '{source_repository:$repository,pr_number:$pr,sha:$sha,image:$image,importer_image:$importer,modules:$modules,build_profile:$build_profile}')"
          timestamp="$(date +%s)"
          signature="$(printf '%s.%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$SECRET" -hex | awk '{print $2}')"
          curl --fail --silent --show-error -X POST "$URL/internal/catalogue" \
            -H 'Content-Type: application/json' -H "X-TC9-Timestamp: $timestamp" \
            -H "X-TC9-Signature: $signature" --data-binary "$body"
