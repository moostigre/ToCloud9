name: Build AzerothCore PR test realm
run-name: Build PR #${{ inputs.pr_number || github.event.client_payload.pr_number }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open AzerothCore PR number
        required: true
        type: number
  repository_dispatch:
    types: [build-ac-testrealm]

permissions:
  contents: read
  packages: write

concurrency:
  group: ac-testrealm-${{ inputs.pr_number || github.event.client_payload.pr_number }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve eligible PR
        id: pr
        env:
          PR_NUMBER: ${{ inputs.pr_number || github.event.client_payload.pr_number }}
        run: |
          case "$PR_NUMBER" in (*[!0-9]*|'') exit 1;; esac
          response="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/azerothcore/azerothcore-wotlk/pulls/$PR_NUMBER")"
          test "$(jq -r .state <<<"$response")" = open
          test "$(jq -r .draft <<<"$response")" = false
          sha="$(jq -r .head.sha <<<"$response")"
          test "${#sha}" = 40
          test "$(git ls-remote https://github.com/azerothcore/azerothcore-wotlk.git "refs/pull/$PR_NUMBER/head" | cut -f1)" = "$sha"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish runtime
        id: runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: game-server/azerothcore/Dockerfile
          target: gameserver
          platforms: linux/amd64
          push: true
          build-args: AC_REF=${{ steps.pr.outputs.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/tc9-ac-pr:pr-${{ steps.pr.outputs.number }}-${{ steps.pr.outputs.sha }}

      - name: Build and publish database importer
        id: importer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: game-server/azerothcore/Dockerfile
          target: db-import
          platforms: linux/amd64
          push: true
          build-args: AC_REF=${{ steps.pr.outputs.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/tc9-ac-pr-dbimport:pr-${{ steps.pr.outputs.number }}-${{ steps.pr.outputs.sha }}

      - name: Publish signed catalogue entry
        if: ${{ secrets.TESTREALM_CATALOG_URL != '' && secrets.TESTREALM_CATALOG_SECRET != '' }}
        env:
          URL: ${{ secrets.TESTREALM_CATALOG_URL }}
          SECRET: ${{ secrets.TESTREALM_CATALOG_SECRET }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          IMPORTER_DIGEST: ${{ steps.importer.outputs.digest }}
        run: |
          body="$(jq -nc --argjson pr "$PR_NUMBER" --arg sha "$SHA" \
            --arg image "ghcr.io/${GITHUB_REPOSITORY_OWNER}/tc9-ac-pr@${RUNTIME_DIGEST}" \
            --arg importer "ghcr.io/${GITHUB_REPOSITORY_OWNER}/tc9-ac-pr-dbimport@${IMPORTER_DIGEST}" \
            '{pr_number:$pr,sha:$sha,image:$image,importer_image:$importer}')"
          timestamp="$(date +%s)"
          signature="$(printf '%s.%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$SECRET" -hex | awk '{print $2}')"
          curl --fail --silent --show-error -X POST "$URL/internal/catalogue" \
            -H 'Content-Type: application/json' -H "X-TC9-Timestamp: $timestamp" \
            -H "X-TC9-Signature: $signature" --data-binary "$body"
